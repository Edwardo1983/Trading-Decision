[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-decision-dashboard"
version = "0.1.0"
description = "Trading decision support dashboard"
requires-python = ">=3.12"
readme = "README.md"

[project.optional-dependencies]
dev = [
  "ruff",
  "mypy",
  "flake8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
